<div class="col-md-4">
  <label class="form-label">Full Name</label>
  <input name="full_name" class="form-control" value="{{ form.get('full_name', '') }}" required>
</div>
<div class="col-md-2">
  <label class="form-label">Date of Birth</label>
  <input name="dob" class="form-control" placeholder="dd/mm/yyyy" value="{{ form.get('dob', '') }}" required>
</div>
<div class="col-md-3">
  <label class="form-label">Email</label>
  <input name="email" class="form-control" value="{{ form.get('email', '') }}" required>
</div>
<div class="col-md-1">
  <label class="form-label">Glucose</label>
  <input name="glucose" class="form-control" value="{{ form.get('glucose', '') }}" required>
</div>
<div class="col-md-1">
  <label class="form-label">Hb</label>
  <input name="haemoglobin" class="form-control" value="{{ form.get('haemoglobin', '') }}" required>
</div>
<div class="col-md-1">
  <label class="form-label">Chol.</label>
  <input name="cholesterol" class="form-control" value="{{ form.get('cholesterol', '') }}" required>
</div>
